<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>炫彩英打挑戰王</title>
  <style>
    /* 國中生喜歡的活潑鮮豔配色 */
    :root {
      --bg-color: #FFDEE9;
      --bg-gradient: linear-gradient(45deg, #FFDEE9 0%, #B5FFFC 100%);
      --container-bg: #ffffff;
      --primary-color: #FF477E; /* 活力粉 */
      --secondary-color: #00D2FF; /* 天空藍 */
      --accent-color: #FFD166; /* 亮黃 */
      --text-color: #2B2D42;
      --success-color: #06D6A0;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif; }
    
    body {
      margin: 0;
      padding: 20px;
      background: var(--bg-color);
      background-image: var(--bg-gradient);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 900px;
      max-width: 100%;
      background: var(--container-bg);
      border-radius: 30px;
      padding: 30px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      border: 4px solid var(--primary-color);
    }

    h1 {
      margin: 0;
      font-size: 32px;
      color: var(--primary-color);
      text-shadow: 2px 2px 0px var(--accent-color);
      text-align: center;
    }

    .user-box {
      background: #f0f4f8;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 15px;
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
    }

    .user-input {
      padding: 8px 15px;
      border-radius: 10px;
      border: 2px solid var(--secondary-color);
      outline: none;
    }

    .mode-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .chip {
      padding: 8px 18px;
      border-radius: 50px;
      border: 2px solid var(--secondary-color);
      background: white;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .chip.active {
      background: var(--secondary-color);
      color: white;
    }

    .target-word {
      font-size: 36px;
      font-weight: bold;
      text-align: center;
      color: var(--primary-color);
      background: #fffafa;
      padding: 20px;
      border-radius: 15px;
      border: 3px dashed var(--secondary-color);
      margin: 15px 0;
    }

    .typing-input {
      width: 100%;
      padding: 15px;
      border-radius: 15px;
      border: 3px solid #ddd;
      font-size: 24px;
      text-align: center;
      outline: none;
      transition: 0.3s;
    }

    .typing-input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 15px rgba(255, 71, 126, 0.2);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      background: var(--secondary-color);
      padding: 15px;
      border-radius: 15px;
      color: white;
      margin-top: 20px;
      font-weight: bold;
      text-align: center;
    }

    .btn {
      padding: 12px 25px;
      border-radius: 50px;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: var(--primary-color);
      color: white;
      box-shadow: 0 4px 0 #d63366;
      transition: 0.2s;
    }

    .btn:active { transform: translateY(3px); box-shadow: none; }

    /* 鍵盤樣式微調 */
    .keyboard { margin-top: 20px; background: #eee; padding: 10px; border-radius: 15px; }
    .key { background: white; color: #333; border: 1px solid #ccc; width: 40px; height: 40px; margin: 2px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; }
    .key.active { background: var(--success-color); color: white; transform: scale(0.95); }
  </style>
</head>
<body>

<div class="container">
  <h1>🚀 炫彩英打挑戰王</h1>
  
  <div class="user-box">
    <label>玩家名稱：</label>
    <input type="text" id="userName" class="user-input" placeholder="輸入你的綽號..." value="匿名英雄">
    <span id="recordDisplay" style="font-weight:bold; color:var(--primary-color)">最高紀錄: -- WPM</span>
  </div>

  <div class="mode-row">
    <button class="chip active" id="modePractice">練習模式</button>
    <button class="chip" id="modeTest">60秒測驗</button>
  </div>

  <div class="target-word" id="targetWord">Ready?</div>

  <input id="typingInput" class="typing-input" type="text" autocomplete="off" placeholder="在此開始輸入...">

  <div id="status" style="text-align:center; margin-top:10px; font-weight:bold;">準備好就開始打字吧！</div>

  <div class="stats">
    <div>時間: <span id="timeStat">0s</span></div>
    <div>正確數: <span id="correctStat">0</span></div>
    <div>速度: <span id="wpmStat">0</span> WPM</div>
  </div>

  <div class="mode-row" style="margin-top:20px;">
    <button class="btn" id="startTestBtn" style="display:none; background: var(--success-color); box-shadow: 0 4px 0 #059669;">開始挑戰！</button>
    <button class="btn" id="resetBtn">重新練習</button>
  </div>
</div>

<script>
// --- 這裡放入你的 Apps Script 部署後的 Web App URL ---
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxIRI8AD4bNIc1KNubEMicnzOkbLPvMC-wjv4MpPmE4vVsi-Ikz7sQygvgPdqAouEc7/exec";

const wordLists = {
  words: ["apple", "banana", "cherry", "dragon", "elephant", "flower", "guitar", "happy", "island", "jungle"],
  // 可自行擴充...
};

let mode = "practice";
let running = false;
let startTime = null;
let elapsed = 0;
let stats = { chars: 0, correct: 0, total: 0 };
let bestWPM = 0;

const targetEl = document.getElementById("targetWord");
const inputEl = document.getElementById("typingInput");
const userNameEl = document.getElementById("userName");
const wpmStatEl = document.getElementById("wpmStat");

function pickTarget() {
  const list = wordLists.words;
  targetEl.textContent = list[Math.floor(Math.random() * list.length)];
  inputEl.value = "";
}

// 傳送資料到 Google 試算表
async function uploadRecord(wpm) {
  const name = userNameEl.value || "匿名英雄";
  try {
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name, wpm: wpm, timestamp: new Date() })
    });
    console.log("記錄已上傳");
  } catch (e) {
    console.error("上傳失敗", e);
  }
}

function updateStats() {
  const minutes = elapsed / 60;
  const wpm = minutes > 0 ? ((stats.chars / 5) / minutes).toFixed(1) : 0;
  wpmStatEl.textContent = wpm;
  document.getElementById("timeStat").textContent = elapsed.toFixed(1) + "s";
  document.getElementById("correctStat").textContent = stats.correct;
  return wpm;
}

function endTest() {
  running = false;
  inputEl.disabled = true;
  const finalWPM = updateStats();
  
  if (finalWPM > bestWPM) {
    bestWPM = finalWPM;
    document.getElementById("recordDisplay").textContent = `最高紀錄: ${bestWPM} WPM`;
  }
  
  document.getElementById("status").textContent = `測驗結束！速度：${finalWPM} WPM`;
  uploadRecord(finalWPM); // 自動上傳紀錄
}

inputEl.addEventListener("input", () => {
  if (!running) {
    running = true;
    startTime = performance.now();
  }
  if (inputEl.value.trim() === targetEl.textContent) {
    stats.correct++;
    stats.chars += targetEl.textContent.length;
    pickTarget();
    updateStats();
  }
});

function tick() {
  if (running) {
    elapsed = (performance.now() - startTime) / 1000;
    if (mode === "test" && elapsed >= 60) {
      elapsed = 60;
      endTest();
    } else {
      updateStats();
      requestAnimationFrame(tick);
    }
  }
}
setInterval(() => { if(running) tick(); }, 100);

document.getElementById("modeTest").onclick = () => {
  mode = "test";
  document.getElementById("startTestBtn").style.display = "block";
  inputEl.disabled = true;
};

document.getElementById("startTestBtn").onclick = () => {
  stats = { chars: 0, correct: 0, total: 0 };
  elapsed = 0;
  running = true;
  startTime = performance.now();
  inputEl.disabled = false;
  inputEl.focus();
  pickTarget();
};

pickTarget();
</script>
</body>
</html>

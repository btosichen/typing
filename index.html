<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>English Typing Practice Keyboard</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      padding: 20px;
      background: #1e293b;
      color: #f9fafb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 900px;
      max-width: 100%;
      background: #0f172a;
      border-radius: 16px;
      padding: 20px 24px 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      font-size: 14px;
      color: #9ca3af;
      margin-bottom: 16px;
    }

    .target-word {
      text-align: center;
      font-size: 22px;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }
    .target-label {
      text-align: center;
      font-size: 14px;
      color: #9ca3af;
      margin-bottom: 4px;
    }

    .typing-area {
      margin: 10px 0 20px;
    }
    .typing-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 2px solid #4b5563;
      background: #020617;
      color: #e5e7eb;
      font-size: 18px;
      outline: none;
    }
    .typing-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 1px #38bdf8;
    }
    .hint {
      font-size: 13px;
      color: #9ca3af;
      margin-top: 6px;
    }

    .keyboard {
      margin-top: 12px;
      user-select: none;
    }
    .kb-row {
      display: flex;
      justify-content: center;
      margin-bottom: 6px;
    }
    .key {
      width: 46px;
      height: 46px;
      margin: 2px;
      border-radius: 8px;
      background: #111827;
      border: 1px solid #374151;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e5e7eb;
      font-size: 16px;
      box-shadow: 0 2px 0 rgba(0,0,0,0.5);
      transition: all 0.08s;
    }
    .key.wide {
      width: 80px;
    }
    .key.space {
      width: 260px;
    }
    .key-label {
      pointer-events: none;
    }
    .key.active {
      background: #22c55e;
      border-color: #bbf7d0;
      color: #022c22;
      transform: translateY(1px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.7);
    }
    .key.correct {
      background: #22c55e;
      border-color: #bbf7d0;
      color: #022c22;
    }
    .key.wrong {
      background: #ef4444;
      border-color: #fecaca;
      color: #7f1d1d;
    }

    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 13px;
      color: #9ca3af;
    }
    .btn {
      padding: 6px 10px;
      border-radius: 999px;
      border: none;
      background: #38bdf8;
      color: #0f172a;
      font-size: 13px;
      cursor: pointer;
    }
    .btn:hover {
      background: #0ea5e9;
    }

    @media (max-width: 640px) {
      .key { width: 34px; height: 40px; font-size: 13px; }
      .key.space { width: 180px; }
      .container { padding: 16px; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>English Typing Practice</h1>
  <div class="subtitle">看著螢幕上的鍵盤，練習正確指法與按鍵位置。</div>

  <div class="target-label">Practice word / sentence</div>
  <div id="targetWord" class="target-word">hello</div>

  <div class="typing-area">
    <input id="typingInput" class="typing-input" type="text" autocomplete="off" placeholder="請依照上方文字輸入…" />
    <div class="hint">提示：請直接用鍵盤輸入，螢幕上的對應按鍵會亮起。</div>
  </div>

  <div class="keyboard" id="keyboard">
    <div class="kb-row">
      <div class="key" data-key="`"><span class="key-label">`</span></div>
      <div class="key" data-key="1"><span class="key-label">1</span></div>
      <div class="key" data-key="2"><span class="key-label">2</span></div>
      <div class="key" data-key="3"><span class="key-label">3</span></div>
      <div class="key" data-key="4"><span class="key-label">4</span></div>
      <div class="key" data-key="5"><span class="key-label">5</span></div>
      <div class="key" data-key="6"><span class="key-label">6</span></div>
      <div class="key" data-key="7"><span class="key-label">7</span></div>
      <div class="key" data-key="8"><span class="key-label">8</span></div>
      <div class="key" data-key="9"><span class="key-label">9</span></div>
      <div class="key" data-key="0"><span class="key-label">0</span></div>
      <div class="key wide" data-key="-"><span class="key-label">-</span></div>
      <div class="key wide" data-key="="><span class="key-label">=</span></div>
    </div>
    <div class="kb-row">
      <div class="key wide" data-key="Tab"><span class="key-label">Tab</span></div>
      <div class="key" data-key="q"><span class="key-label">Q</span></div>
      <div class="key" data-key="w"><span class="key-label">W</span></div>
      <div class="key" data-key="e"><span class="key-label">E</span></div>
      <div class="key" data-key="r"><span class="key-label">R</span></div>
      <div class="key" data-key="t"><span class="key-label">T</span></div>
      <div class="key" data-key="y"><span class="key-label">Y</span></div>
      <div class="key" data-key="u"><span class="key-label">U</span></div>
      <div class="key" data-key="i"><span class="key-label">I</span></div>
      <div class="key" data-key="o"><span class="key-label">O</span></div>
      <div class="key" data-key="p"><span class="key-label">P</span></div>
      <div class="key wide" data-key="["><span class="key-label">[</span></div>
      <div class="key wide" data-key="]"><span class="key-label">]</span></div>
    </div>
    <div class="kb-row">
      <div class="key wide" data-key="CapsLock"><span class="key-label">Caps</span></div>
      <div class="key" data-key="a"><span class="key-label">A</span></div>
      <div class="key" data-key="s"><span class="key-label">S</span></div>
      <div class="key" data-key="d"><span class="key-label">D</span></div>
      <div class="key" data-key="f"><span class="key-label">F</span></div>
      <div class="key" data-key="g"><span class="key-label">G</span></div>
      <div class="key" data-key="h"><span class="key-label">H</span></div>
      <div class="key" data-key="j"><span class="key-label">J</span></div>
      <div class="key" data-key="k"><span class="key-label">K</span></div>
      <div class="key" data-key="l"><span class="key-label">L</span></div>
      <div class="key wide" data-key=";"><span class="key-label">;</span></div>
      <div class="key wide" data-key="'"><span class="key-label">'</span></div>
    </div>
    <div class="kb-row">
      <div class="key wide" data-key="ShiftLeft"><span class="key-label">Shift</span></div>
      <div class="key" data-key="z"><span class="key-label">Z</span></div>
      <div class="key" data-key="x"><span class="key-label">X</span></div>
      <div class="key" data-key="c"><span class="key-label">C</span></div>
      <div class="key" data-key="v"><span class="key-label">V</span></div>
      <div class="key" data-key="b"><span class="key-label">B</span></div>
      <div class="key" data-key="n"><span class="key-label">N</span></div>
      <div class="key" data-key="m"><span class="key-label">M</span></div>
      <div class="key wide" data-key=","><span class="key-label">,</span></div>
      <div class="key wide" data-key="."><span class="key-label">.</span></div>
      <div class="key wide" data-key="/"><span class="key-label">/</span></div>
      <div class="key wide" data-key="ShiftRight"><span class="key-label">Shift</span></div>
    </div>
    <div class="kb-row">
      <div class="key wide" data-key="Control"><span class="key-label">Ctrl</span></div>
      <div class="key wide" data-key="Alt"><span class="key-label">Alt</span></div>
      <div class="key space" data-key=" "><span class="key-label">Space</span></div>
      <div class="key wide" data-key="AltGraph"><span class="key-label">Alt</span></div>
      <div class="key wide" data-key="ControlRight"><span class="key-label">Ctrl</span></div>
    </div>
  </div>

  <div class="bottom-bar">
    <div id="status">狀態：請照上方文字練習輸入。</div>
    <button class="btn" id="nextBtn">換一個單字</button>
  </div>
</div>

<script>
  const keys = document.querySelectorAll(".key");
  const input = document.getElementById("typingInput");
  const statusEl = document.getElementById("status");
  const targetEl = document.getElementById("targetWord");
  const nextBtn = document.getElementById("nextBtn");

  const words = [
    "hello", "apple", "school", "computer", "keyboard",
    "teacher", "student", "capybara", "fox", "turtle",
    "island", "ocean", "music", "happy", "practice",
    "english typing", "good job", "see you", "thank you"
  ];

  function pickWord() {
    const w = words[Math.floor(Math.random() * words.length)];
    targetEl.textContent = w;
    input.value = "";
    statusEl.textContent = "狀態：請照上方文字練習輸入。";
  }

  nextBtn.addEventListener("click", pickWord);
  pickWord();
  input.focus();

  // 找到螢幕上的按鍵元素
  function findKeyElement(e) {
    if (e.key === " ") return document.querySelector('.key[data-key=" "]');
    // 特殊鍵用 code / key 處理
    if (e.code === "ShiftLeft") return document.querySelector('.key[data-key="ShiftLeft"]');
    if (e.code === "ShiftRight") return document.querySelector('.key[data-key="ShiftRight"]');
    if (e.code === "CapsLock") return document.querySelector('.key[data-key="CapsLock"]');
    if (e.code === "Tab") return document.querySelector('.key[data-key="Tab"]');
    if (e.code === "ControlLeft") return document.querySelector('.key[data-key="Control"]');
    if (e.code === "ControlRight") return document.querySelector('.key[data-key="ControlRight"]');
    if (e.code === "AltLeft" || e.code === "AltRight") return document.querySelector('.key[data-key="Alt"]');

    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    return document.querySelector('.key[data-key="' + k + '"]');
  }

  window.addEventListener("keydown", (e) => {
    const keyEl = findKeyElement(e);
    if (keyEl) {
      keyEl.classList.add("active");
      setTimeout(() => keyEl.classList.remove("active"), 120);
    }

    // 自動對照輸入是否正確
    const target = targetEl.textContent;
    const text = input.value;

    if (target.startsWith(text)) {
      statusEl.textContent = "狀態：目前輸入正確 ✓";
    } else {
      statusEl.textContent = "狀態：有錯字囉，請檢查。";
    }
  });

  // Enter 換下一個單字（方便學生一直練）
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      pickWord();
    }
  });
</script>
</body>
</html>

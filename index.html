<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>🚀 炫彩英打挑戰王</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #FF9A9E 0%, #FAD0C4 99%, #FAD0C4 100%);
      --primary: #FF477E;
      --secondary: #4CC9F0;
      --accent: #F9C74F;
      --success: #06D6A0;
      --white: #ffffff;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif; }
    
    body {
      margin: 0; padding: 20px;
      background-image: var(--bg-gradient);
      min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
    }

    .container {
      width: 800px; background: var(--white);
      border-radius: 30px; padding: 40px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
      border: 5px solid var(--primary);
      text-align: center;
    }

    /* 頁面切換控制 */
    .page { display: none; }
    .active-page { display: block; }

    h1 { color: var(--primary); font-size: 36px; text-shadow: 2px 2px var(--accent); }

    /* 首頁樣式 */
    .login-box { margin-bottom: 30px; }
    .user-input {
      padding: 15px; width: 250px; border-radius: 15px;
      border: 3px solid var(--secondary); font-size: 18px; outline: none;
    }

    /* 排行榜樣式 */
    .leaderboard {
      background: #f8f9fa; border-radius: 20px; padding: 20px;
      margin: 20px 0; border: 2px dashed var(--secondary);
    }
    .leaderboard h3 { margin-top: 0; color: var(--secondary); }
    .rank-item {
      display: flex; justify-content: space-between;
      padding: 8px 20px; border-bottom: 1px solid #ddd;
    }
    .rank-item:last-child { border: none; }
    .rank-item b { color: var(--primary); }

    /* 試算表連結 */
    .sheet-link {
      display: inline-block; margin-top: 15px; color: #666;
      text-decoration: none; font-size: 14px;
    }
    .sheet-link:hover { color: var(--primary); text-decoration: underline; }

    /* 按鈕樣式 */
    .btn {
      padding: 15px 40px; border-radius: 50px; border: none;
      font-size: 20px; font-weight: bold; cursor: pointer;
      background: var(--primary); color: white;
      box-shadow: 0 5px 0 #d63366; transition: 0.2s;
    }
    .btn:hover { transform: scale(1.05); }
    .btn:active { transform: translateY(3px); box-shadow: none; }

    /* 遊戲內元件 */
    .target-word { font-size: 40px; color: var(--primary); margin: 20px; font-weight: bold; }
    .typing-input { width: 100%; padding: 15px; font-size: 24px; border-radius: 15px; border: 3px solid #ddd; text-align: center; }
    .stats { display: flex; justify-content: space-around; background: var(--secondary); color: white; padding: 15px; border-radius: 15px; margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  
  <div id="homePage" class="page active-page">
    <h1>🎮 英打大挑戰</h1>
    <div class="login-box">
      <input type="text" id="userName" class="user-input" placeholder="輸入你的大名..." value="匿名英雄">
    </div>

    <div class="leaderboard">
      <h3>🏆 今日排行榜 (Top 5)</h3>
      <div id="rankList">載入中...</div>
    </div>

    <button class="btn" onclick="goToGame()">開始挑戰</button>
    <br>
    <a href="https://docs.google.com/spreadsheets/d/1KfIbjGgR3gdseaf7aQwGvzawOPn3Tb1cLDFOHHyVGmQ/edit?usp=sharing" 
       target="_blank" class="sheet-link">
       📊 點此查看後台 Google 試算表記錄
    </a>
  </div>

  <div id="gamePage" class="page">
    <h2 id="displayName">玩家：載入中...</h2>
    <div class="target-word" id="targetWord">Loading...</div>
    <input id="typingInput" class="typing-input" type="text" autocomplete="off" placeholder="在此開始輸入...">
    <div id="status" style="margin-top:10px; font-weight:bold;">輸入第一個字開始計時 60 秒！</div>
    
    <div class="stats">
      <div>時間: <span id="timeStat">60s</span></div>
      <div>速度: <span id="wpmStat">0</span> WPM</div>
    </div>
    
    <div style="margin-top: 20px;">
      <button class="btn" style="background:#6c757d; box-shadow: 0 5px 0 #495057;" onclick="goToHome()">回首頁</button>
    </div>
  </div>

</div>

<script>
  // 請填入你的 GAS 部署網址
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyKYix4qsh3gWFY4BX_z2wArPjS7O-k4nAGf5xPyAGf5UjXjn0ssQ6LJjL3fbQRKehD/exec";

  let currentUser = "";
  let running = false;
  let startTime = null;
  let timeLeft = 60;
  let stats = { chars: 0 };
  const words = ["apple", "banana", "computer", "keyboard", "student", "school", "english", "practice", "game", "winner"];

  // 1. 切換到遊戲頁
  function goToGame() {
    currentUser = document.getElementById("userName").value || "匿名英雄";
    document.getElementById("displayName").textContent = "玩家：" + currentUser;
    document.getElementById("homePage").classList.remove("active-page");
    document.getElementById("gamePage").classList.add("active-page");
    resetGame();
  }

  // 2. 切換到首頁
  function goToHome() {
    document.getElementById("gamePage").classList.remove("active-page");
    document.getElementById("homePage").classList.add("active-page");
    loadLeaderboard(); // 回首頁時更新排行榜
  }

  function resetGame() {
    running = false;
    timeLeft = 60;
    stats.chars = 0;
    document.getElementById("wpmStat").textContent = "0";
    document.getElementById("timeStat").textContent = "60s";
    document.getElementById("typingInput").value = "";
    document.getElementById("typingInput").disabled = false;
    pickTarget();
  }

  function pickTarget() {
    document.getElementById("targetWord").textContent = words[Math.floor(Math.random() * words.length)];
    document.getElementById("typingInput").value = "";
  }

  // 輸入事件
  document.getElementById("typingInput").addEventListener("input", (e) => {
    if (!running && e.target.value.length > 0) {
      running = true;
      startTime = Date.now();
      startTimer();
    }
    if (e.target.value.trim() === document.getElementById("targetWord").textContent) {
      stats.chars += document.getElementById("targetWord").textContent.length;
      pickTarget();
      updateWPM();
    }
  });

  function startTimer() {
    let timer = setInterval(() => {
      timeLeft--;
      document.getElementById("timeStat").textContent = timeLeft + "s";
      if (timeLeft <= 0) {
        clearInterval(timer);
        endGame();
      }
    }, 1000);
  }

  function updateWPM() {
    let elapsedMins = (60 - timeLeft) / 60;
    let wpm = elapsedMins > 0 ? Math.round((stats.chars / 5) / elapsedMins) : 0;
    document.getElementById("wpmStat").textContent = wpm;
  }

  function endGame() {
    running = false;
    document.getElementById("typingInput").disabled = true;
    let finalWPM = document.getElementById("wpmStat").textContent;
    alert("時間到！你的速度是: " + finalWPM + " WPM");
    uploadRecord(finalWPM);
  }

  // GAS: 上傳分數
  async function uploadRecord(wpm) {
    fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      body: JSON.stringify({ name: currentUser, wpm: wpm })
    });
  }

  // GAS: 載入排行榜
  async function loadLeaderboard() {
    try {
      const res = await fetch(SCRIPT_URL);
      const data = await res.json();
      let html = "";
      data.forEach((item, index) => {
        html += `<div class="rank-item"><span>${index+1}. ${item.name}</span><b>${item.wpm} WPM</b></div>`;
      });
      document.getElementById("rankList").innerHTML = html || "暫無紀錄";
    } catch (e) {
      document.getElementById("rankList").textContent = "暫時無法載入";
    }
  }

  // 初始載入排行榜
  loadLeaderboard();
</script>
</body>
</html>

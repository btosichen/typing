<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>English Typing Practice Keyboard + Sound</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body {
      margin: 0; padding: 20px;
      background: #1e293b; color: #f9fafb;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 900px; background: #0f172a;
      border-radius: 16px; padding: 20px; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    h1 { text-align: center; margin: 0 0 6px; }
    .target-word { text-align: center; font-size: 22px; margin: 8px 0; }
    .typing-input {
      width: 100%; padding: 10px; font-size: 18px;
      background: #020617; color: #e5e7eb;
      border: 2px solid #475569; border-radius: 10px;
    }
    .keyboard { margin-top: 12px; }
    .kb-row { display: flex; justify-content: center; margin-bottom: 4px; }
    .key {
      width: 46px; height: 46px; margin: 2px;
      background: #111827; border: 1px solid #374151;
      border-radius: 8px; display: flex; justify-content: center; align-items: center;
      color: #e5e7eb; font-size: 16px;
      transition: 0.08s; box-shadow: 0 2px 0 rgba(0,0,0,0.6);
    }
    .key.wide { width: 80px; }
    .key.space { width: 260px; }
    .key.active {
      background: #22c55e; border-color: #bbf7d0; color: #022c22;
      transform: translateY(1px);
    }
  </style>
</head>
<body>
<div class="container">
  <h1>English Typing Practice</h1>

  <div class="target-word" id="targetWord">hello</div>

  <input id="typingInput" class="typing-input" placeholder="請依照上方文字輸入…" />

  <!-- Keyboard layout -->
  <div class="keyboard" id="keyboard">
    <div class="kb-row">
      <div class="key" data-key="`">`</div>
      <div class="key" data-key="1">1</div>
      <div class="key" data-key="2">2</div>
      <div class="key" data-key="3">3</div>
      <div class="key" data-key="4">4</div>
      <div class="key" data-key="5">5</div>
      <div class="key" data-key="6">6</div>
      <div class="key" data-key="7">7</div>
      <div class="key" data-key="8">8</div>
      <div class="key" data-key="9">9</div>
      <div class="key" data-key="0">0</div>
      <div class="key wide" data-key="-">-</div>
      <div class="key wide" data-key="=">=</div>
    </div>

    <div class="kb-row">
      <div class="key wide" data-key="Tab">Tab</div>
      <div class="key" data-key="q">Q</div>
      <div class="key" data-key="w">W</div>
      <div class="key" data-key="e">E</div>
      <div class="key" data-key="r">R</div>
      <div class="key" data-key="t">T</div>
      <div class="key" data-key="y">Y</div>
      <div class="key" data-key="u">U</div>
      <div class="key" data-key="i">I</div>
      <div class="key" data-key="o">O</div>
      <div class="key" data-key="p">P</div>
      <div class="key wide" data-key="[">[</div>
      <div class="key wide" data-key="]">]</div>
    </div>

    <div class="kb-row">
      <div class="key wide" data-key="CapsLock">Caps</div>
      <div class="key" data-key="a">A</div>
      <div class="key" data-key="s">S</div>
      <div class="key" data-key="d">D</div>
      <div class="key" data-key="f">F</div>
      <div class="key" data-key="g">G</div>
      <div class="key" data-key="h">H</div>
      <div class="key" data-key="j">J</div>
      <div class="key" data-key="k">K</div>
      <div class="key" data-key="l">L</div>
      <div class="key wide" data-key=";">;</div>
      <div class="key wide" data-key="'">'</div>
    </div>

    <div class="kb-row">
      <div class="key wide" data-key="ShiftLeft">Shift</div>
      <div class="key" data-key="z">Z</div>
      <div class="key" data-key="x">X</div>
      <div class="key" data-key="c">C</div>
      <div class="key" data-key="v">V</div>
      <div class="key" data-key="b">B</div>
      <div class="key" data-key="n">N</div>
      <div class="key" data-key="m">M</div>
      <div class="key wide" data-key=",">,</div>
      <div class="key wide" data-key=".">.</div>
      <div class="key wide" data-key="/">/</div>
      <div class="key wide" data-key="ShiftRight">Shift</div>
    </div>

    <div class="kb-row">
      <div class="key wide" data-key="Control">Ctrl</div>
      <div class="key wide" data-key="Alt">Alt</div>
      <div class="key space" data-key=" ">Space</div>
      <div class="key wide" data-key="AltGraph">Alt</div>
      <div class="key wide" data-key="ControlRight">Ctrl</div>
    </div>
  </div>
</div>

<script>
/* --------------------------
   🔊 keyboard click sound
   (base64 tiny wav file)
--------------------------- */

const clickSoundData =
"data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAIlYAAESsAAACABAAZGF0YRAAAAAA/////wAAAP///wD///8A";

const audioPool = [];
for (let i = 0; i < 10; i++) {
  const audio = new Audio(clickSoundData);
  audioPool.push(audio);
}

function playClickSound() {
  const audio = audioPool.find(a => a.paused);
  if (audio) {
    audio.currentTime = 0;
    audio.play();
  } else {
    // 如果全部在播，就強制重播第一個
    audioPool[0].currentTime = 0;
    audioPool[0].play();
  }
}

/* --------------------------
   Highlight key + sound
--------------------------- */
function findKeyElement(e) {
  if (e.key === " ") return document.querySelector('.key[data-key=" "]');
  if (e.code === "ShiftLeft") return document.querySelector('.key[data-key="ShiftLeft"]');
  if (e.code === "ShiftRight") return document.querySelector('.key[data-key="ShiftRight"]');
  if (e.code === "CapsLock") return document.querySelector('.key[data-key="CapsLock"]');
  if (e.code === "Tab") return document.querySelector('.key[data-key="Tab"]');
  if (e.code === "ControlLeft") return document.querySelector('.key[data-key="Control"]');
  if (e.code === "ControlRight") return document.querySelector('.key[data-key="ControlRight"]');
  if (e.code === "AltLeft" || e.code === "AltRight") return document.querySelector('.key[data-key="Alt"]');

  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  return document.querySelector(`.key[data-key="${k}"]`);
}

window.addEventListener("keydown", (e) => {
  const keyEl = findKeyElement(e);
  if (keyEl) {
    keyEl.classList.add("active");
    setTimeout(() => keyEl.classList.remove("active"), 120);

    playClickSound(); // 🔊 播放音效
  }
});
</script>

</body>
</html>

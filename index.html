<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>🚀 炫彩英打挑戰王</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #FF9A9E 0%, #FAD0C4 99%, #FAD0C4 100%);
      --primary: #FF477E;
      --secondary: #4CC9F0;
      --accent: #F9C74F;
      --success: #06D6A0;
      --white: #ffffff;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif; }
    
    body {
      margin: 0; padding: 20px;
      background-image: var(--bg-gradient);
      min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
    }

    .container {
      width: 800px; background: var(--white);
      border-radius: 30px; padding: 40px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
      border: 5px solid var(--primary);
      text-align: center;
    }

    /* 頁面切換控制 */
    .page { display: none; }
    .active-page { display: block; }

    h1 { color: var(--primary); font-size: 36px; text-shadow: 2px 2px var(--accent); }

    /* 首頁樣式 */
    .login-box { margin-bottom: 30px; }
    .user-input {
      padding: 15px; width: 250px; border-radius: 15px;
      border: 3px solid var(--secondary); font-size: 18px; outline: none;
    }

    /* 排行榜樣式 */
    .leaderboard {
      background: #f8f9fa; border-radius: 20px; padding: 20px;
      margin: 20px 0; border: 2px dashed var(--secondary);
    }
    .leaderboard h3 { margin-top: 0; color: var(--secondary); }
    .rank-item {
      display: flex; justify-content: space-between;
      padding: 8px 20px; border-bottom: 1px solid #ddd;
    }
    .rank-item:last-child { border: none; }
    .rank-item b { color: var(--primary); }

    /* 試算表連結 */
    .sheet-link {
      display: inline-block; margin-top: 15px; color: #666;
      text-decoration: none; font-size: 14px;
    }
    .sheet-link:hover { color: var(--primary); text-decoration: underline; }

    /* 按鈕樣式 */
    .btn {
      padding: 15px 40px; border-radius: 50px; border: none;
      font-size: 20px; font-weight: bold; cursor: pointer;
      background: var(--primary); color: white;
      box-shadow: 0 5px 0 #d63366; transition: 0.2s;
    }
    .btn:hover { transform: scale(1.05); }
    .btn:active { transform: translateY(3px); box-shadow: none; }

    /* 遊戲內元件 */
    .target-word { font-size: 40px; color: var(--primary); margin: 20px; font-weight: bold; }
    .typing-input { width: 100%; padding: 15px; font-size: 24px; border-radius: 15px; border: 3px solid #ddd; text-align: center; outline: none; transition: 0.3s; }
    .typing-input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(255, 71, 126, 0.2); }
    .stats { display: flex; justify-content: space-around; background: var(--secondary); color: white; padding: 15px; border-radius: 15px; margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  
  <div id="homePage" class="page active-page">
    <h1>🎮 英打大挑戰</h1>
    <div class="login-box">
      <input type="text" id="userName" class="user-input" placeholder="輸入你的大名..." value="匿名英雄">
    </div>

    <div class="leaderboard">
      <h3>🏆 今日排行榜 (Top 5)</h3>
      <div id="rankList">載入中...</div>
    </div>

    <button class="btn" onclick="goToGame()">開始挑戰</button>
    <br>
    <a href="https://docs.google.com/spreadsheets/d/1KfIbjGgR3gdseaf7aQwGvzawOPn3Tb1cLDFOHHyVGmQ/edit?usp=sharing" 
       target="_blank" class="sheet-link">
       📊 點此查看後台 Google 試算表記錄
    </a>
  </div>

  <div id="gamePage" class="page">
    <h2 id="displayName">玩家：載入中...</h2>
    <div class="target-word" id="targetWord">Loading...</div>
    <input id="typingInput" class="typing-input" type="text" autocomplete="off" placeholder="在此開始輸入...">
    <div id="status" style="margin-top:10px; font-weight:bold;">輸入第一個字開始計時 60 秒！</div>
    
    <div class="stats">
      <div>時間: <span id="timeStat">60s</span></div>
      <div>速度: <span id="wpmStat">0</span> WPM</div>
    </div>
    
    <div style="margin-top: 20px;">
      <button class="btn" style="background:#6c757d; box-shadow: 0 5px 0 #495057;" onclick="goToHome()">回首頁</button>
    </div>
  </div>

</div>

<script>
  // 請填入你的 GAS 部署網址
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzonylnbfe_bbzdJ8Nz-IYJAn2UiKx-zFcMutasCXq1eJSLYfifag795Jao_tkt0UwJ/exec";

  let currentUser = "";
  let running = false;
  let startTime = null;
  let timeLeft = 60;
  let stats = { chars: 0 };
  const words = [
    "apple","banana","orange","grape","peach","melon","lemon","cherry","mango","fruit",
    "dog","cat","bird","fish","tiger","lion","monkey","rabbit","horse","animal",
    "school","student","teacher","class","lesson","homework","subject","exam","test","study",
    "book","pen","pencil","paper","desk","chair","bag","ruler","eraser","notebook",
    "computer","keyboard","mouse","screen","laptop","tablet","internet","website","email","password",
    "game","player","winner","score","level","stage","start","finish","battle","mission",
    "happy","sad","angry","excited","tired","hungry","thirsty","funny","cool","great",
    "morning","afternoon","evening","night","today","tomorrow","yesterday","always","never","sometimes",
    "family","father","mother","brother","sister","friend","people","person","child","baby",
    "city","village","country","island","mountain","river","ocean","beach","forest","park",
    "food","drink","water","juice","milk","bread","rice","noodle","cake","cookie",
    "music","song","dance","movie","video","picture","camera","photo","sound","voice",
    "run","walk","jump","swim","read","write","listen","speak","watch","play",
    "open","close","start","stop","push","pull","turn","move","hold","carry",
    "big","small","long","short","fast","slow","hot","cold","new","old",
    "red","blue","green","yellow","black","white","purple","brown","pink","color",
    "one","two","three","four","five","six","seven","eight","nine","ten",
    "hundred","thousand","number","count","math","plus","minus","times","divide","answer",
    "time","clock","minute","second","hour","early","late","before","after","during",
    "door","window","floor","wall","room","kitchen","bedroom","bathroom","house","home",
    "shirt","pants","shoes","hat","coat","dress","jacket","clothes","wear","style",
    "car","bus","train","bike","plane","boat","travel","trip","ticket","station",
    "phone","call","message","chat","social","media","online","login","logout","account",
    "code","program","robot","data","input","output","system","model","design","build",
    "idea","think","learn","teach","know","understand","remember","forget","practice","improve",
    "question","answer","problem","solution","example","exercise","challenge","goal","plan","result",
    "easy","hard","simple","difficult","important","useful","interesting","boring","fun","cool",
    "win","lose","try","fail","success","effort","focus","attention","practice","repeat",
    "hello","thanks","please","sorry","welcome","goodbye","yes","no","okay","right",
    "capybara","turtle","fox","island","rescue","protect","explore","adventure","danger","escape",
    "science","history","language","english","chinese","math","art","music","sports","health",
    "teacher","student","classmate","group","team","leader","member","share","help","support",
    "clean","dirty","safe","dangerous","strong","weak","smart","kind","brave","honest",
    "sun","moon","star","sky","cloud","rain","wind","storm","weather","season",
    "spring","summer","autumn","winter","hot","warm","cool","cold","temperature","degree",
    "gameplay","control","button","click","drag","drop","scoreboard","ranking","record","history",
    "file","folder","save","load","delete","copy","paste","edit","update","download",
    "upload","search","find","select","enter","exit","menu","option","setting","system"
  ];

  /* ------------------- 音效系統 (Web Audio API) ------------------- */
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  const audioCtx = new AudioContext();

  // 1. 打字聲 (短促的Tick)
  function playKeySound() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, audioCtx.currentTime); // 頻率
    gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime); // 音量
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05); // 快速淡出
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);
  }

  // 2. 答對單字的聲音 (清脆的叮聲)
  function playCorrectSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
    gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.5);
  }

  // 3. 遊戲結束的聲音 (Ta-da 兩個音符)
  function playEndSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    // 第一個音
    const osc1 = audioCtx.createOscillator();
    const gain1 = audioCtx.createGain();
    osc1.type = 'square';
    osc1.frequency.setValueAtTime(440, audioCtx.currentTime);
    gain1.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain1.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
    osc1.connect(gain1); gain1.connect(audioCtx.destination);
    osc1.start(); osc1.stop(audioCtx.currentTime + 0.2);

    // 第二個音 (較高)
    const osc2 = audioCtx.createOscillator();
    const gain2 = audioCtx.createGain();
    osc2.type = 'square';
    osc2.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.2);
    gain2.gain.setValueAtTime(0.1, audioCtx.currentTime + 0.2);
    gain2.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.8);
    osc2.connect(gain2); gain2.connect(audioCtx.destination);
    osc2.start(audioCtx.currentTime + 0.2);
    osc2.stop(audioCtx.currentTime + 0.8);
  }
  /* --------------------------------------------------------------- */

  // 1. 切換到遊戲頁
  function goToGame() {
    // 喚醒音效引擎 (瀏覽器安全機制：必須在使用者點擊按鈕時觸發)
    if (audioCtx.state === 'suspended') audioCtx.resume();

    currentUser = document.getElementById("userName").value || "匿名英雄";
    document.getElementById("displayName").textContent = "玩家：" + currentUser;
    document.getElementById("homePage").classList.remove("active-page");
    document.getElementById("gamePage").classList.add("active-page");
    resetGame();
  }

  // 2. 切換到首頁
  function goToHome() {
    document.getElementById("gamePage").classList.remove("active-page");
    document.getElementById("homePage").classList.add("active-page");
    loadLeaderboard(); // 回首頁時更新排行榜
  }

  function resetGame() {
    running = false;
    timeLeft = 60;
    stats.chars = 0;
    document.getElementById("wpmStat").textContent = "0";
    document.getElementById("timeStat").textContent = "60s";
    document.getElementById("typingInput").value = "";
    document.getElementById("typingInput").disabled = false;
    pickTarget();
    // 自動聚焦輸入框
    setTimeout(() => document.getElementById("typingInput").focus(), 100);
  }

  function pickTarget() {
    document.getElementById("targetWord").textContent = words[Math.floor(Math.random() * words.length)];
    document.getElementById("typingInput").value = "";
  }

  // 監聽鍵盤按下事件 (用於播放打字聲)
  document.getElementById("typingInput").addEventListener("keydown", (e) => {
    // 只針對一般字元或退格鍵播放聲音 (排除 Enter, Tab, Shift 等)
    if (e.key.length === 1 || e.key === 'Backspace') {
      playKeySound();
    }
  });

  // 輸入事件
  document.getElementById("typingInput").addEventListener("input", (e) => {
    if (!running && e.target.value.length > 0) {
      running = true;
      startTime = Date.now();
      startTimer();
    }
    
    // 如果輸入正確
    if (e.target.value.trim() === document.getElementById("targetWord").textContent) {
      stats.chars += document.getElementById("targetWord").textContent.length;
      playCorrectSound(); // 播放答對音效
      pickTarget();
      updateWPM();
    }
  });

  function startTimer() {
    let timer = setInterval(() => {
      timeLeft--;
      document.getElementById("timeStat").textContent = timeLeft + "s";
      if (timeLeft <= 0) {
        clearInterval(timer);
        endGame();
      }
    }, 1000);
  }

  function updateWPM() {
    let elapsedMins = (60 - timeLeft) / 60;
    let wpm = elapsedMins > 0 ? Math.round((stats.chars / 5) / elapsedMins) : 0;
    document.getElementById("wpmStat").textContent = wpm;
  }

  function endGame() {
    running = false;
    document.getElementById("typingInput").disabled = true;
    playEndSound(); // 播放結束音效
    let finalWPM = document.getElementById("wpmStat").textContent;
    
    // 延遲一點點顯示 Alert，才不會卡住音效播放
    setTimeout(() => {
      alert("時間到！你的速度是: " + finalWPM + " WPM");
      uploadRecord(finalWPM);
    }, 200);
  }

  // GAS: 上傳分數
  async function uploadRecord(wpm) {
    fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      body: JSON.stringify({ name: currentUser, wpm: wpm })
    });
  }

  // GAS: 載入排行榜
  async function loadLeaderboard() {
    try {
      const res = await fetch(SCRIPT_URL);
      const data = await res.json();
      let html = "";
      data.forEach((item, index) => {
        html += `<div class="rank-item"><span>${index+1}. ${item.name}</span><b>${item.wpm} WPM</b></div>`;
      });
      document.getElementById("rankList").innerHTML = html || "暫無紀錄";
    } catch (e) {
      document.getElementById("rankList").textContent = "暫時無法載入";
    }
  }

  // 初始載入排行榜
  loadLeaderboard();
</script>
</body>
</html>
